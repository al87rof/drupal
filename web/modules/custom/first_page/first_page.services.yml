services:
  first_page.route_subscriber:
    class: Drupal\first_page\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }
  first_page.twig_extension:
    class: Drupal\first_page\Twig\FirstPageTwigExtension
    tags:
      - { name: twig.extension }
  first_page.query_service:
    class: Drupal\first_page\Services\Query\QueryService
    arguments: ['@entity_type.manager']
  first_page.weather_service:
    class: Drupal\first_page\Services\Weather\WeatherService
    arguments:
      - '@http_client'
      - '@cache.default'
