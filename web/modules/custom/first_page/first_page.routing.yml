first_page.example:
  path: '/my-first-page'
  defaults:
    _title: 'Example'
    _controller: '\Drupal\first_page\Controller\FirstPageController::firstPage'
  requirements:
    _permission: 'access content'

front_page:
  path: '/node'
  defaults:
    _controller: '\Drupal\first_page\Controller\FirstPageController::frontPage'
    _title: 'Home'

my_module.hello_page:
  path: '/hello'
  defaults:
    _controller: '\Drupal\first_page\Controller\FirstPageController::helloPage'
    _title: 'Hello'
  requirements:
    _permission: 'access content'

first_page.test:
  path: '/first-page/test'
  defaults:
    _title: 'Test'
    _form: 'Drupal\first_page\Form\TestForm'
  requirements:
    _permission: 'access content'
first_page.count_nodes:
  path: '/nodes-count'
  defaults:
    _controller: '\Drupal\first_page\Controller\FirstPageController::countNodesPage'
    _title: 'Count Nodes'
  requirements:
    _permission: 'access content'
first_page.settings_form:
  path: '/admin/config/first-page-settings'
  defaults:
    _form: '\Drupal\first_page\Form\SettingsForm'
    _title: 'Settings  First Page'
  requirements:
    _permission: 'administer site configuration'
first_page.dump_entity:
  path: '/dump-entity'
  defaults:
    _controller: '\Drupal\first_page\Controller\FirstPageController::dumpPage'
    _title: 'Entity Dump'
  requirements:
    _permission: 'access content'
